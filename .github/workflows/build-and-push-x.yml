name: Build and push backend-x

on:
  push:
    tags:
      - '*-x.*'

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/samur005/backend-x
  FRONTEND_URL: https://github.com/samur005/frontend-X/releases/download/3.4.11-x.5/remnawave-frontend.zip
  FRONTEND_REPO: samur005/frontend-X
  FRONTEND_TAG: 3.4.11-x.5

jobs:
  build-docker-images:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          frontend_commit=$(gh api "repos/${FRONTEND_REPO}/git/ref/tags/${FRONTEND_TAG}" --jq '.object.sha' || true)
          if [ -z "$frontend_commit" ] || [ "$frontend_commit" = "null" ]; then
            frontend_commit=$(gh api "repos/${FRONTEND_REPO}/releases/tags/${FRONTEND_TAG}" --jq '.target_commitish' || true)
          fi
          echo "frontend_commit=${frontend_commit}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FRONTEND_URL=${{ env.FRONTEND_URL }}
            __RW_METADATA_GIT_BRANCH=feat/qwdtt
            __RW_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_VERSION=${{ github.ref_name }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
          outputs: |
            type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push manifests
    needs: [build-docker-images]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.GHCR_IMAGE }}:3 \
            -t ${{ env.GHCR_IMAGE }}:latest \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
          digest=$(docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.ref_name }} --format '{{json .Manifest}}' | jq -r '.digest // .Digest // empty')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            if gh api -X POST "/users/samur005/packages/container/backend-x/visibility" -f visibility=public; then
              echo "Package backend-x is public"
              exit 0
            fi
            if gh api -X POST "/user/packages/container/backend-x/visibility" -f visibility=public; then
              echo "Package backend-x is public"
              exit 0
            fi
            sleep 10
          done
          echo "Could not set backend-x visibility to public; the package may stay private."
          exit 0
